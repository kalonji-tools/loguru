name: Tests

on:
  push:
  pull_request:
  schedule:
  - cron: 0 0 * * 0

jobs:
  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # The test suite runs on oxitest, which requires Python 3.11 or later. The library
    # itself still supports older interpreters, but they can no longer be exercised here.
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-22.04
        python-version:
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        - pypy-3.11
        allow-failure:
        - false
        include:
        - os: windows-2022
          python-version: '3.12'
          allow-failure: false
        - os: macos-15
          python-version: '3.12'
          allow-failure: false
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Run tests
      run: |
        tox -e tests
      continue-on-error: ${{ matrix.allow-failure }}
    - name: Upload coverage data
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ matrix.python-version }}-${{ matrix.os }}
        path: coverage.xml
      continue-on-error: ${{ matrix.allow-failure }}
  typesafety:
    # The stub is checked against mypy by "pytest-mypy-plugins", which asserts on mypy
    # output from YAML cases and therefore still runs under pytest.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Check type stub
      run: |
        tox -e typesafety
  push-coverage-to-codecov:
    runs-on: ubuntu-22.04
    needs: tests
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Download artifacts
      uses: actions/download-artifact@v8
    - name: Upload to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
        fail_ci_if_error: true
