[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core>=3,<4"]

[project]
authors = [{ name = "Delgan", email = "delgan.py@gmail.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Topic :: System :: Logging",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.5",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "colorama>=0.3.4 ; sys_platform=='win32'",
  "aiocontextvars>=0.2.0 ; python_version<'3.7'",
  "win32-setctime>=1.0.0 ; sys_platform=='win32'",
]
description = "Python logging made (stupidly) simple"
dynamic = ['version']
keywords = ["loguru", "logging", "logger", "log"]
license = { file = "LICENSE" }
name = "loguru"
readme = 'README.md'
requires-python = ">=3.5"

[project.optional-dependencies]
dev = [
  # Setup.
  "pre-commit==4.3.0 ; python_version>='3.9'",
  "tox==3.27.1 ; python_version<'3.8'",
  "tox==4.24.1 ; python_version>='3.8' and python_version<'3.9'",
  "tox==4.30.2 ; python_version>='3.9'",
  # Testing framework. Requires Python 3.11 or later, which is therefore the floor for
  # running the test suite; the library itself still supports older interpreters.
  "oxitest==3.0.0 ; python_version>='3.11'",
  "coverage==7.6.1 ; python_version>='3.11'",
  # Type-safety suite. Driven by "pytest-mypy-plugins", which asserts on mypy output from
  # YAML cases rather than running Python tests, and has no oxitest equivalent.
  "pytest==8.4.1 ; python_version>='3.12'",
  "pytest-mypy-plugins==3.2.0 ; python_version>='3.12'",
  # Testing utils.
  "colorama==0.4.6 ; python_version>='3.11'",
  "freezegun==1.5.0 ; python_version>='3.11'",
  # Type checking.
  "mypy==v0.910 ; python_version<'3.6'",
  "mypy==v0.971 ; python_version>='3.6' and python_version<'3.7'",
  "mypy==v1.4.1 ; python_version>='3.7' and python_version<'3.8'",
  "mypy==v1.14.1 ; python_version>='3.8' and python_version<'3.9'",
  "mypy==v1.18.2 ; python_version>='3.9' and python_version<'3.12'",
  "mypy==v1.20.0 ; python_version>='3.12'",
  # Docs.
  "Sphinx==8.2.1 ; python_version>='3.11'",
  "sphinx-rtd-theme==3.0.2 ; python_version>='3.11'",
  "myst-parser==4.0.0 ; python_version>='3.11'",
  # Packaging.
  "build==1.3.0 ; python_version>='3.11'",
  "twine==6.2.0 ; python_version>='3.11'",
]

[project.urls]
Changelog = "https://github.com/Delgan/loguru/blob/master/CHANGELOG.rst"
Documentation = "https://loguru.readthedocs.io/en/stable/index.html"
Homepage = "https://github.com/Delgan/loguru"

[tool.black]
force-exclude = "tests/exceptions/source/modern/*"
line-length = 100
target-version = ["py35"]

[tool.pyright]
# Types are defined in a stub file. Unfortunately, type checkers such as Pyright and Mypy are
# unable to "merge" them with the file containing the actual Python implementation. This causes
# many false positives, therefore type checking is disabled to avoid noisy errors in the editor.
typeCheckingMode = "off"

[tool.flit.module]
name = "loguru"

[tool.oxitest]
# ── Mandatory floor (T7 baseline #1667) ─────────────
strict = "abort"
testpaths = ["tests"]
show_locals = true
# Reporters: TTY default + CTRF JSON via CLI flag
# oxitest --json results/oxitest-last.ctrf.json

# Warnings are turned into errors by the autouse "strict_warnings" fixture in
# "tests/conftest.py" rather than by configuration, since oxitest has no equivalent of
# pytest's "filterwarnings" key.

[tool.coverage.run]
source = ["loguru"]

[tool.pytest.ini_options]
# Only the type-safety suite still runs under pytest; everything else uses oxitest.
addopts = "-l"
testpaths = ["tests/typesafety"]

[tool.ruff]
exclude = ["tests/exceptions/source/*"]
line-length = 100

# Actually, we should target Python 3.5, but Ruff does not support it.
target-version = "py37"

[tool.ruff.lint]
# See list of rules at: https://docs.astral.sh/ruff/rules/
# "PT" (flake8-pytest-style) is intentionally absent: the test suite runs on oxitest, whose
# fixtures, marks and parametrize decorators those rules do not describe.
select = ["F", "E", "W", "I", "B", "N", "D", "PYI", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "D1", # Do not require documentation for tests.
]
"loguru/__init__.pyi" = [
  "PYI026", # TypeAlias is not supported by Mypy 0.910 (Python 3.5).
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.typos.default]
extend-ignore-re = ["(?Rm)^.*# spellchecker: disable-line$"]

[tool.typos.default.extend-identifiers]
asend = "asend"

[tool.typos.files]
extend-exclude = [
  "tests/exceptions/output/**", # False positive due to ansi sequences.
]
