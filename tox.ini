[tox]
envlist = lint, tests, typesafety, docs, build
isolated_build = True

[testenv]
setenv = PYTHONPATH = {toxinidir}
extras = dev

[testenv:lint]
description = Run linting checks on all project files.
commands =
    pre-commit run --show-diff-on-failure --all-files

[testenv:tests]
description = Run the tests and generate code coverage.
# "--serial" is required alongside "--cov": oxitest points worker subprocesses at the first
# config file coverage.py read, which here is this very tox.ini and carries no coverage
# settings, so the workers never enable parallel data files and overwrite each other's.
commands =
    coverage erase
    oxitest -v --serial --cov --cov-report none
    coverage report -m
    coverage xml

[testenv:typesafety]
description = Check the type stub against mypy. Still driven by pytest-mypy-plugins.
commands =
    pytest -vv tests/typesafety

[testenv:docs]
description = Build the HTML documentation.
commands =
    sphinx-build -a -b html -W --keep-going docs/ docs/build

[testenv:build]
description = Build the Python package.
commands =
    pyproject-build .
    twine check --strict dist/*
